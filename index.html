<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07101b">
<meta name="description" content="Interactive recreation of the classic Xbox 360 Blades dashboard interface.">
<title>Xbox 360 Blades</title><link rel="stylesheet" href="index.css"><script src="index.js" defer></script>
</head>
<body>
<main class="console" aria-label="Xbox 360 Blades dashboard">
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<header class="topbar"><div class="brand"><span class="orb"><i></i></span><span>XBOX</span><b>360</b></div><div class="system-status"><i></i><span id="clock">--:--</span><span class="divider"></span>CONNECTED</div></header>
<nav class="blade-nav" aria-label="Dashboard sections" role="tablist">
<button class="blade-tab live active" role="tab" aria-selected="true" data-blade="0"><span>◉</span>Xbox Live</button>
<button class="blade-tab games" role="tab" aria-selected="false" data-blade="1"><span>✦</span>Games</button>
<button class="blade-tab media" role="tab" aria-selected="false" data-blade="2"><span>♫</span>Media</button>
<button class="blade-tab system" role="tab" aria-selected="false" data-blade="3"><span>⚙</span>System</button>
</nav>
<section class="dashboard">
<div class="blade-edge"></div><div class="blade-content">
<div class="blade-heading"><div><div class="eyebrow" id="blade-kicker">XBOX LIVE</div><h1 id="blade-title">Welcome to Xbox Live</h1></div>
<div class="profile-chip"><div class="avatar">G</div><div><strong>Guest</strong><small>Sign in to your profile</small></div></div></div>
<div class="content-grid"><div class="menu-column"><div class="menu-label">DASHBOARD</div><div id="menu-items" class="menu-items" role="listbox" aria-label="Dashboard options"></div>
<div class="nav-hint"><span class="dpad">✥</span> Navigate <span class="button-hint">A</span> Select <span class="button-hint">B</span> Back</div></div>
<article class="feature-panel" aria-live="polite"><div class="feature-art" id="feature-art"><div class="rings"></div><div class="feature-symbol" id="feature-symbol">◉</div><div class="feature-stamp">XBOX 360</div></div>
<div class="feature-copy"><div class="eyebrow" id="feature-kicker">WELCOME</div><h2 id="feature-title">Your entertainment starts here.</h2><p id="feature-description">Connect, play, and explore your Xbox 360 dashboard.</p><button id="action-button" class="action-button">Explore <span>›</span></button></div></article></div>
</div></section>
<footer class="footer"><span>◀ <b>LB</b> <b>RB</b> Switch blades</span><span>Xbox 360 Dashboard • Browser recreation</span><span id="footer-section">XBOX LIVE</span></footer>
</main><div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
