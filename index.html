<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#777d80"><meta name="description" content="A browser recreation of the original Xbox 360 Blades dashboard.">
<title>Xbox 360 Dashboard</title><link rel="stylesheet" href="index.css"><script src="index.js" defer></script>
</head>
<body>
<main class="tv" aria-label="Xbox 360 dashboard recreation">
  <div class="screen">
    <div class="screen-glare"></div>
    <div class="side-tabs left-tabs" id="left-tabs" aria-label="Previous blades"></div>
    <section class="active-blade" id="active-blade">
      <header class="blade-header">
        <h1 id="page-title">Welcome to Xbox Live</h1>
        <div class="xbox-mark"><span class="xbox-orb">X</span><span>XBOX <b>360</b></span></div>
      </header>
      <div class="blade-main">
        <div class="item-list-wrap">
          <div class="list-heading" id="list-heading">Xbox Live</div>
          <div class="item-list" id="item-list" role="listbox" aria-label="Dashboard items"></div>
          <div class="scroll-cue">⌄</div>
        </div>
        <aside class="preview" id="preview" aria-live="polite">
          <div class="preview-art" id="preview-art"><div class="art-orbit"></div><div class="art-mark" id="art-mark">X</div></div>
          <h2 id="preview-title">Connect to Xbox Live</h2>
          <p id="preview-description">Create a profile and connect with friends, games, and entertainment.</p>
          <div class="content-rating"><span>Available Content</span><div class="rating-icons"><i>◉</i><i>▦</i></div></div>
        </aside>
      </div>
      <footer class="blade-footer">
        <div class="footer-left"><span><b class="y">Y</b><span id="y-action">Search</span></span><span><b class="x">X</b>Legal Information</span></div>
        <div class="footer-right"><span><b class="b">B</b> Back</span><span><b class="a">A</b> Select</span></div>
      </footer>
    </section>
    <div class="side-tabs right-tabs" id="right-tabs" aria-label="Next blades"></div>
  </div>
  <div class="bezel-bottom"><span>◉</span><span>XBOX 360</span><span class="bezel-light"></span></div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
